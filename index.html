<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form action="" class="weatherform">
        <input type="text" class="weatherinput" placeholder="Enter city you want to search">
        <button type="submit">Get Weather</button>
    </form>
    <div class="card">
        <h1 class="title">Miami</h1>
        <p class="temperature">90°F</p>
        <p class="humidity">Humidity 75%</p>
        <p class="descDisplay">Clear Skies</p>
        <p class="weatherimg">🌞</p>
        <p class="errorDisplay">Please Enter a city</p>
    </div>
</body>
</html>
